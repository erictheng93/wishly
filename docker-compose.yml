# 本機開發環境（D38）：PostGIS、MinIO（模擬 R2）、Mailpit（收 OTP 信）
services:
  db:
    image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
    environment:
      POSTGRES_USER: wishly
      POSTGRES_PASSWORD: wishly
      POSTGRES_DB: wishly
    ports: ["5432:5432"]
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wishly"]
      interval: 2s
      retries: 30
  minio:
    image: bitnamilegacy/minio:2025.5.24-debian-12-r5@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c   # minio/minio 已自 Docker Hub 下架
    environment:
      MINIO_ROOT_USER: wishly
      MINIO_ROOT_PASSWORD: wishly-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/bitnami/minio/data]
  mailpit:
    image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    ports: ["1025:1025", "8025:8025"]
volumes:
  db:
  minio:
