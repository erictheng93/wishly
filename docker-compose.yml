# 本機開發環境（D38）：PostGIS、MinIO（模擬 R2）、Mailpit（收 OTP 信）
services:
  db:
    image: postgis/postgis:16-3.6@sha256:d07ce3f06f657b6516c7511412232e97174d7e9dcf4c9fe520109b682b44a201
    platform: linux/amd64 # 官方映像沒有 arm64，Apple Silicon 走模擬
    environment:
      POSTGRES_USER: wishly
      POSTGRES_PASSWORD: wishly
      POSTGRES_DB: wishly
    ports: ["5432:5432"]
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wishly"]
      interval: 2s
      retries: 30
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20   # minio/minio 已自 Docker Hub 下架
    environment:
      MINIO_ROOT_USER: wishly
      MINIO_ROOT_PASSWORD: wishly-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/bitnami/minio/data]
  mailpit:
    image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    ports: ["1025:1025", "8025:8025"]
volumes:
  db:
  minio:
