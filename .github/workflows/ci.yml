name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Recheck the advisory database weekly even when the lockfile is unchanged.
    - cron: "0 1 * * 1"
jobs:
  api:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.5@sha256:94146ac37bc61e2322f88016056c5920729cb8c64c8542ed590af8fc2abdac07
        env: { POSTGRES_USER: wishly, POSTGRES_PASSWORD: wishly, POSTGRES_DB: wishly }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wishly" --health-interval 2s --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
        ports: ["1025:1025", "8025:8025"]
    env:
      DATABASE_URL: postgres://wishly:wishly@localhost:5432/wishly
      APP_ENV: dev
      SMTP_HOST: localhost
      MAILPIT_API_BASE: http://localhost:8025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@ff7f6a3374ce205788da40198ec918bd5d67aea7 # 1.99.0
        with: { components: rustfmt, clippy, llvm-tools-preview }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { workspaces: apps/api }
      - run: cargo fmt --manifest-path apps/api/Cargo.toml --check
      - run: cargo clippy --manifest-path apps/api/Cargo.toml --all-targets -- -D warnings
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with: { tool: "cargo-llvm-cov@0.9.1,cargo-audit@0.22.2" }
      - run: sh scripts/audit-api.sh
      - run: python3 scripts/test_coverage.py
      - run: sh scripts/coverage-api.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: api-coverage
          path: apps/api/target/coverage.json
  mutate:
    # 突變測試（約 18 分鐘）量測的是測試強度，不擋 publish-image；失敗仍會讓 run 標紅。
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.5@sha256:94146ac37bc61e2322f88016056c5920729cb8c64c8542ed590af8fc2abdac07
        env: { POSTGRES_USER: wishly, POSTGRES_PASSWORD: wishly, POSTGRES_DB: wishly }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wishly" --health-interval 2s --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
        ports: ["1025:1025", "8025:8025"]
    env:
      DATABASE_URL: postgres://wishly:wishly@localhost:5432/wishly
      APP_ENV: dev
      SMTP_HOST: localhost
      MAILPIT_API_BASE: http://localhost:8025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@ff7f6a3374ce205788da40198ec918bd5d67aea7 # 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { workspaces: apps/api }
      - run: python3 scripts/test_mutate.py
      - run: scripts/mutate.sh all
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: api-mutations
          path: apps/api/target/mutations/
  image:
    # 只驗證 Dockerfile 能建置（不 push）；build context 必須是 repo 根目錄。
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f apps/api/Dockerfile -t wishly-api:ci .
  web:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: web-coverage
          path: apps/web/coverage/
  web-audit:
    # 每週排程也會跑：沒有 push 時仍能發現新公告（含 overrides 換成 fork 的 braces／node-forge，npm audit 以名稱＋版本比對）
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci --ignore-scripts
      - run: npm run audit:security
  e2e:
    if: github.event_name != 'schedule'
    # Playwright 端對端測試（見 README「測試」）：真實的 API + Web + Postgres + Mailpit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db:
        image: postgis/postgis:16-3.5@sha256:94146ac37bc61e2322f88016056c5920729cb8c64c8542ed590af8fc2abdac07
        env: { POSTGRES_USER: wishly, POSTGRES_PASSWORD: wishly, POSTGRES_DB: wishly }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wishly" --health-interval 2s --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
        ports: ["1025:1025", "8025:8025"]
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@ff7f6a3374ce205788da40198ec918bd5d67aea7 # 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { workspaces: apps/api }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      # e2e/support/psql.mjs 用 psql 重建 wishly_e2e 資料庫
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npx playwright install --with-deps chromium
      # 啟動 API / Web 由 playwright.config.ts 的 webServer 負責（cargo build + 重置資料庫 + nuxt build）
      - run: npm run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
  publish-image:
    # main 的測試全綠後才推 GHCR（映像維持 Private；標籤為 commit SHA，Dokploy 以 SHA 部署與回滾）。
    # Dokploy 拉映像需用 GitHub PAT 登入 GHCR（見 docs/deploy-runbook.md）。
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [api, image, web, e2e]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/erictheng93/wishly-api:${{ github.sha }}
            ghcr.io/erictheng93/wishly-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
