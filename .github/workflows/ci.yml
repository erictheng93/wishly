name: ci
on:
  push:
  pull_request:
  schedule:
    # Recheck the advisory database weekly even when the lockfile is unchanged.
    - cron: "0 1 * * 1"
jobs:
  api:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_USER: wishsync, POSTGRES_PASSWORD: wishsync, POSTGRES_DB: wishsync }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wishsync" --health-interval 2s --health-retries 30
      mailpit:
        image: axllent/mailpit
        ports: ["1025:1025", "8025:8025"]
    env:
      DATABASE_URL: postgres://wishsync:wishsync@localhost:5432/wishsync
      APP_ENV: dev
      SMTP_HOST: localhost
      MAILPIT_API_BASE: http://localhost:8025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with: { components: rustfmt, clippy, llvm-tools-preview }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/api }
      - run: cargo fmt --manifest-path apps/api/Cargo.toml --check
      - run: cargo clippy --manifest-path apps/api/Cargo.toml --all-targets -- -D warnings
      - uses: taiki-e/install-action@v2
        with: { tool: "cargo-llvm-cov@0.9.1,cargo-audit@0.22.2" }
      - run: sh scripts/audit-api.sh
      - run: python3 scripts/test_mutate.py
      - run: python3 scripts/test_coverage.py
      - run: sh scripts/coverage-api.sh
      - run: scripts/mutate.sh all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-mutations
          path: apps/api/target/mutations/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-coverage
          path: apps/api/target/coverage.json
  web:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-coverage
          path: apps/web/coverage/
  web-audit:
    # Upstream advisories stay visible without hiding web typecheck/test/build results.
    # Keep this advisory-only job out of required PR checks until the tracked upstream fixes land.
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm audit --audit-level=high --json > npm-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-audit
          path: apps/web/npm-audit.json
  native:
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with: { components: rustfmt, clippy }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/web/src-tauri }
      - run: cargo fmt --manifest-path apps/web/src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path apps/web/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path apps/web/src-tauri/Cargo.toml --lib
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-audit@0.22.2 }
      - run: cargo audit --file apps/web/src-tauri/Cargo.lock
  e2e:
    if: github.event_name != 'schedule'
    # Playwright 端對端測試（見 README「測試」）：真實的 API + Web + Postgres + Mailpit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_USER: wishsync, POSTGRES_PASSWORD: wishsync, POSTGRES_DB: wishsync }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wishsync" --health-interval 2s --health-retries 30
      mailpit:
        image: axllent/mailpit
        ports: ["1025:1025", "8025:8025"]
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/api }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      # e2e/support/psql.mjs 用 psql 重建 wishsync_e2e 資料庫
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npx playwright install --with-deps chromium
      # 啟動 API / Web 由 playwright.config.ts 的 webServer 負責（cargo build + 重置資料庫 + nuxt build）
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
