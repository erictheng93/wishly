# 更新已固定 SHA／digest 的 actions 與本機開發映像（會一併改版本註解）
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
    groups:
      compose: { patterns: ["*"] }
    ignore:
      # PostgreSQL 大版本資料格式不相容（本機 volume 會起不來），且需與 CI / 正式環境的 16 一致；升級時手動處理
      - dependency-name: postgis/postgis
        update-types: ["version-update:semver-major"]
