<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#c8102e">
<title>目前離線 | Wishly</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mute:#666;--red:#c8102e;--red-text:#c8102e;--btn:#c8102e;--red-dark:#a30d25;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0e0e0e;--fg:#f2f2f2;--mute:#a8a8a8;--red:#e5334f;--red-text:#f0566e;--btn:#d92b47;--red-dark:#b82840}}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background:var(--bg);color:var(--fg);font:400 16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;letter-spacing:.02em}
main{max-width:360px;width:100%}
.top{color:var(--red-text);font-weight:700;letter-spacing:.14em;border-bottom:3px solid var(--red);padding-bottom:10px;margin-bottom:28px;font-size:12px}
h1{margin:0 0 8px;font-size:26px;line-height:1.2}
p{margin:0 0 28px;color:var(--mute)}
button{border:0;min-height:44px;background:var(--btn);color:#fff;font:inherit;font-weight:600;font-size:14px;letter-spacing:.14em;padding:12px 24px;border-radius:0;cursor:pointer}
button:active{background:var(--red-dark)}
button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
</style>
</head>
<body>
<main>
<div class="top">WISHLY</div>
<h1>目前離線</h1>
<p>連線後會自動重試。你也可以隨時手動重新整理。</p>
<button type="button" onclick="location.reload()">重新整理</button>
</main>
<script>
// online 事件只代表網卡恢復，不代表真的連得上（Service Worker 的網路也可能晚一步恢復）：
// 先試抓本頁網址，抓得到才重新整理；失敗就退避重試，直到成功或再次離線。直接 reload 會在恢復瞬間又落回離線頁，之後不再有 online 事件而卡住。
let wait=500,timer=0
function retry(){clearTimeout(timer);if(!navigator.onLine)return
  fetch(location.href,{cache:'no-store'}).then(()=>location.reload(),()=>{timer=setTimeout(retry,wait);wait=Math.min(wait*2,30000)})}
addEventListener('online',()=>{wait=500;retry()})
// 本頁是在「瀏覽器認為在線」時顯示的（伺服器暫時連不上等），也要自己重試；直接開 /offline 時不重試，否則會不斷重新整理
if(navigator.onLine&&location.pathname!=='/offline')timer=setTimeout(retry,wait)
</script>
</body>
</html>
